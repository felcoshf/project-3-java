<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавление студента</title>
</head>
<body>
<h2>Добавить нового студента</h2>

<form th:action="@{/students/add}" th:object="${student}" method="post">
    <div>
        <label>Имя:</label>
        <input type="text" th:field="*{name}" required />
    </div>
    <br>
    <div>
        <label>Курс:</label>
        <input type="text" th:field="*{course}" required />
    </div>
    <br>
    <div>
        <label>Задолженность:</label>
        <input type="checkbox" th:field="*{hasDebt}" />
    </div>
    <br>
    <button type="submit">Сохранить</button>
    <a th:href="@{/students}"><button type="button">Отмена</button></a>
</form>
</body>
</html>
