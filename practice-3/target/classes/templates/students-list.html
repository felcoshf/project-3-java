<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список студентов</title>
</head>
<body>
<h2>Список студентов</h2>

<div>
    <a th:href="@{/students/add}"><button>Добавить студента</button></a>
    <a th:href="@{/logout}" style="float: right;"><button>Выйти</button></a>
</div>

<br><br>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Курс</th>
        <th>Задолженность</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="student : ${students}">
        <td th:text="${student.id}"></td>
        <td th:text="${student.name}"></td>
        <td th:text="${student.course}"></td>
        <td th:text="${student.hasDebt}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
